[project]
name = "resongme"
version = "0.1.0"
description = "Turn your resume into a song: Claude writes the lyrics, a music model sings them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=2.71.0"]
ui = ["gradio>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
resongme = "resongme.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resongme*"]
